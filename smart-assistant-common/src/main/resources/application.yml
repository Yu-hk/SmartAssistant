# ⭐ OpenTelemetry 共享配置（Langfuse LLM 可观测性集成）
# 所有模块继承此配置，各模块可在自己的 application.yml 中按需覆盖
spring:
  ai:
    chat:
      observations:
        log-prompt: true        # 将 prompt 内容写入 OTel span（Langfuse 需要）
        log-completion: true    # 将 completion 内容写入 OTel span
management:
  tracing:
    sampling:
      probability: 1.0          # 100% 采样（生产环境可调低）
  observations:
    annotations:
      enabled: true
    enable:
      "http.server.requests": false   # 抑制重复的 HTTP server span
      "http.client.requests": false   # 抑制重复的 HTTP client span
otel:
  # No OTLP collector is bundled in the default deployment. Keep the SDK
  # available for Langfuse/OTLP opt-in, but do not retry localhost:4318.
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:none}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}
  instrumentation:
    spring-webmvc:
      enabled: false                  # 抑制重复的 OTel HTTP server span
    spring-web:
      enabled: false                  # 抑制重复的 OTel HTTP client span

# ⭐ MinerU 适配器配置（PDF 解析增强：扫描件/复杂混排走 MinerU，数字 PDF 走 PDFBox 零子进程）
# 部署环境安装 magic-pdf 与 sidecar 后启用；route-on-images=true 时含图片即整体路由 MinerU。
# 配置前缀 app.rag.mineru.*（见 MinerUProperties）
app:
  rag:
    mineru:
      enabled: ${MINERU_ENABLED:false}      # 显式启用；未安装 sidecar 的环境安全使用 PDFBox
      route-on-images: ${MINERU_ROUTE_ON_IMAGES:true} # 含图片即路由 MinerU（仅 enabled=true 时生效）
      sidecar-command: ${MINERU_SIDECAR_CMD:python mineru_sidecar.py}
      warm-instances: 1                    # 进程池预热实例数（模型仅加载一次）
      timeout-ms: 600000                   # 单次解析超时（毫秒，65 页文档 MinerU 较慢）
      fallback-to-pdfbox: true             # MinerU 失败回退 PDFBox 全链路
      caption-exclusive: true              # R5 caption 独占：MinerU 活跃时禁用 PDFBox 图片 caption/OCR
      images-temp-dir: ${MINERU_IMAGES_TMP:/tmp/mineru}         # MinerU 抽取图片临时目录
      enabled-image-vectorization: false   # 图片向量化（v1 仅存路径，不向量化）
