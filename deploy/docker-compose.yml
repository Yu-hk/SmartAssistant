# =============================================================================
# SmartAssistant - 生产环境 Docker 部署
# =============================================================================
# 前置条件：
#   1. 安装 Docker & Docker Compose v2
#   2. 从项目根目录构建：mvn clean package -DskipTests
#   3. 前端构建：cd frontend && npm run build
#   4. 复制 .env.production 为 .env 并填入真实密钥
#
# 启动：docker compose --env-file .env up -d
# 停止：docker compose --env-file .env down
# 查看日志：docker compose logs -f
# =============================================================================

services:
  # ===========================
  # 统一入口 — Nginx 反向代理
  # ===========================
  nginx:
    image: nginx:1.27-alpine
    container_name: smart-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    networks:
      - smart-network
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy

  # ===========================
  # 基础设施
  # ===========================
  redis:
    image: redis:7.2.4
    container_name: smart-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    networks:
      - smart-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: smart-rabbitmq
    expose:
      - "5672"
      - "15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-smartassistant}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - smart-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nacos:
    image: nacos/nacos-server:v3.1.0
    container_name: smart-nacos
    ports:
      - "8848:8080"
      - "9848:9848"
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=512m
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN must be set (base64, >=32 bytes)}
      - NACOS_AUTH_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_AUTH_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD must be set}
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - smart-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: smart-postgres
    ports:
      - "0.0.0.0:5432:5432"
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-a2a_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docs/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../docs/database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    command: >
      -c shared_preload_libraries=vector
      -c max_connections=200
    networks:
      smart-network:
        ipv4_address: 10.89.1.4
        aliases:
          - smart-postgres
          - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-a2a_system}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: smart-zipkin
    expose:
      - "9411"
    networks:
      - smart-network
    restart: unless-stopped

  # ===========================
  # 后端微服务
  # ===========================
  gateway:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: smart-assistant-gateway
    container_name: smart-gateway
    expose:
      - "8081"
    environment:
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-smartassistant}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD must be set}
      # Docker 环境覆盖
      SPRING_DATA_REDIS_HOST: smart-redis
      SPRING_RABBITMQ_HOST: smart-rabbitmq
      ROUTER_GRAPH_RECOVERY_ENABLED: ${ROUTER_GRAPH_RECOVERY_ENABLED:-true}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: smart-nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD must be set}
      MANAGEMENT_TRACING_ZIPKIN_TRACING_ENDPOINT: http://smart-zipkin:9411/api/v2/spans
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    networks:
      - smart-network
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  user:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: smart-assistant-user
    container_name: smart-user
    expose:
      - "8086"
    environment:
      PORT: 8086
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://xiaoyuai.cloud,https://www.xiaoyuai.cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD must be set}
      OAUTH_PUBLIC_BASE_URL: ${OAUTH_PUBLIC_BASE_URL:-https://xiaoyuai.cloud}
      OAUTH_FRONTEND_BASE_URL: ${OAUTH_FRONTEND_BASE_URL:-https://xiaoyuai.cloud}
      OAUTH_WECHAT_ENABLED: ${OAUTH_WECHAT_ENABLED:-false}
      OAUTH_WECHAT_CLIENT_ID: ${OAUTH_WECHAT_CLIENT_ID:-}
      OAUTH_WECHAT_CLIENT_SECRET: ${OAUTH_WECHAT_CLIENT_SECRET:-}
      OAUTH_DINGTALK_ENABLED: ${OAUTH_DINGTALK_ENABLED:-false}
      OAUTH_DINGTALK_CLIENT_ID: ${OAUTH_DINGTALK_CLIENT_ID:-}
      OAUTH_DINGTALK_CLIENT_SECRET: ${OAUTH_DINGTALK_CLIENT_SECRET:-}
      OAUTH_FEISHU_ENABLED: ${OAUTH_FEISHU_ENABLED:-false}
      OAUTH_FEISHU_CLIENT_ID: ${OAUTH_FEISHU_CLIENT_ID:-}
      OAUTH_FEISHU_CLIENT_SECRET: ${OAUTH_FEISHU_CLIENT_SECRET:-}
      # Docker 环境覆盖
      SPRING_DATA_REDIS_HOST: smart-redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SPRING_DATASOURCE_URL: jdbc:postgresql://smart-postgres:5432/${POSTGRES_DB:-a2a_system}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: smart-nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD must be set}
      MANAGEMENT_TRACING_ZIPKIN_TRACING_ENDPOINT: http://smart-zipkin:9411/api/v2/spans
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    networks:
      - smart-network
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  consumer:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: smart-assistant-consumer
    container_name: smart-consumer
    expose:
      - "8082"
    environment:
      PORT: 8082
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD must be set}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SPRING_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      CONSUMER_LIGHT_MODEL_NAME: ${MODEL_LIGHT:-deepseek-v4-flash}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-smartassistant}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      SPRING_RABBITMQ_HOST: smart-rabbitmq
      ROUTER_SERVICE_URL: http://smart-router:8083
      EMBEDDING_SERVICE_URL: http://smart-embedding:8091
      # Docker 环境覆盖
      SPRING_DATA_REDIS_HOST: smart-redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://smart-postgres:5432/${POSTGRES_DB:-a2a_system}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: smart-nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD must be set}
      MANAGEMENT_TRACING_ZIPKIN_TRACING_ENDPOINT: http://smart-zipkin:9411/api/v2/spans
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    networks:
      - smart-network
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  router:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: smart-assistant-router
    container_name: smart-router
    expose:
      - "8083"
    environment:
      PORT: 8083
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD must be set}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SPRING_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ROUTER_LIGHT_MODEL_NAME: ${MODEL_LIGHT:-deepseek-v4-flash}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      TOOL_REGISTRY_URL: http://smart-tool-registry:8088
      EMBEDDING_SERVICE_URL: http://smart-embedding:8091
      # Docker 环境覆盖
      SPRING_DATA_REDIS_HOST: smart-redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://smart-postgres:5432/${POSTGRES_DB:-a2a_system}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: smart-nacos:8848
      MANAGEMENT_TRACING_ZIPKIN_TRACING_ENDPOINT: http://smart-zipkin:9411/api/v2/spans
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    networks:
      - smart-network
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tool-registry:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  tool-registry:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: smart-assistant-tool-registry
        JAR_SUFFIX: 1.0.0-SNAPSHOT-exec.jar
    container_name: smart-tool-registry
    expose:
      - "8088"
    environment:
      PORT: 8088
      TOOL_REGISTRY_URL: http://smart-tool-registry:8088
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    networks:
      - smart-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  order:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: smart-assistant-order
    container_name: smart-order
    expose:
      - "8085"
    environment:
      PORT: 8085
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD must be set}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SPRING_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ORDER_LIGHT_MODEL_NAME: ${MODEL_LIGHT:-deepseek-v4-flash}
      SPRING_JACKSON_DESERIALIZATION_FAIL_ON_NULL_FOR_PRIMITIVES: "false"
      EMBEDDING_SERVICE_URL: http://smart-embedding:8091
      # Docker 环境覆盖
      SPRING_DATA_REDIS_HOST: smart-redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://smart-postgres:5432/${POSTGRES_DB:-a2a_system}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: smart-nacos:8848
      MANAGEMENT_TRACING_ZIPKIN_TRACING_ENDPOINT: http://smart-zipkin:9411/api/v2/spans
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    networks:
      - smart-network
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  product:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: smart-assistant-product
    container_name: smart-product
    expose:
      - "8084"
    environment:
      PORT: 8084
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD must be set}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY must be set}
      PRODUCT_CHAT_MODEL: ${PRODUCT_CHAT_MODEL:-qwen3.7-flash}
      PRODUCT_ANALYSIS_MODEL: ${PRODUCT_ANALYSIS_MODEL:-qwen3.7-flash}
      PRODUCT_STANDARD_MODEL: ${PRODUCT_STANDARD_MODEL:-qwen3.7-flash}
      PRODUCT_RECOMMENDATION_MODEL: ${PRODUCT_RECOMMENDATION_MODEL:-qwen3.7-plus}
      SPRING_JACKSON_DESERIALIZATION_FAIL_ON_NULL_FOR_PRIMITIVES: "false"
      PRODUCT_RAG_AGENTIC_ENABLED: ${PRODUCT_RAG_AGENTIC_ENABLED:-true}
      PRODUCT_RAG_AGENTIC_MAX_ATTEMPTS: ${PRODUCT_RAG_AGENTIC_MAX_ATTEMPTS:-2}
      PRODUCT_RAG_AGENTIC_MAX_EVIDENCE_ITEMS: ${PRODUCT_RAG_AGENTIC_MAX_EVIDENCE_ITEMS:-8}
      PRODUCT_RAG_AGENTIC_SUFFICIENT_SCORE: ${PRODUCT_RAG_AGENTIC_SUFFICIENT_SCORE:-0.5}
      PRODUCT_RAG_ANSWER_VERIFICATION_MAX_RETRIES: ${PRODUCT_RAG_ANSWER_VERIFICATION_MAX_RETRIES:-1}
      EMBEDDING_SERVICE_URL: http://smart-embedding:8091
      DATASOURCE_URL: jdbc:postgresql://smart-postgres:5432/${POSTGRES_DB:-a2a_system}
      DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Docker 环境覆盖
      SPRING_DATA_REDIS_HOST: smart-redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://smart-postgres:5432/${POSTGRES_DB:-a2a_system}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: smart-nacos:8848
      MANAGEMENT_TRACING_ZIPKIN_TRACING_ENDPOINT: http://smart-zipkin:9411/api/v2/spans
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    networks:
      - smart-network
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  embedding-service:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: smart-assistant-embedding-service
    container_name: smart-embedding
    expose:
      - "8091"
    environment:
      PORT: 8091
      NACOS_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD must be set}
      # Docker 环境覆盖
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: smart-nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD must be set}
      BGE_MODEL_PATH: /app/models/bge-large-zh-v1.5.onnx
      BGE_VOCAB_PATH: /app/models/tokenizer.json
    volumes:
      - ../models:/app/models:ro
    networks:
      - smart-network
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

# ===========================
# 网络 & 持久卷
# ===========================
networks:
  smart-network:
    name: smart-network
    external: true

volumes:
  redis-data:
  rabbitmq-data:
  nacos-data:
  postgres-data:
