# Operation names and field IDs are the execution protocol. These entries only define
# domain-owned required fields, aliases, and user-facing clarification labels.
operation.CREATE_ORDER.required=product,recipientName,recipientPhone,shippingAddress
operation.TRACK_LOGISTICS.required=orderNumber
operation.QUERY_PAYMENT_PENDING.required=orderNumber
operation.CANCEL_ORDER.required=orderNumber,reason
operation.REFUND_ORDER.required=orderNumber,reason
operation.APPLY_AFTER_SALES.required=orderNumber,afterSalesType,reason
field.product.aliases=product,product_name,productName
field.product.label=具体商品
field.recipientName.aliases=recipientName,recipient_name,contact_name,contactName
field.recipientName.label=收货人姓名
field.recipientPhone.aliases=recipientPhone,recipient_phone,contact_phone,contactPhone
field.recipientPhone.label=联系电话
field.shippingAddress.aliases=shippingAddress,shipping_address,address
field.shippingAddress.label=收货地址
field.orderNumber.aliases=orderNumber,order_id,orderId,order_number
field.orderNumber.label=订单号
field.reason.aliases=reason,cancel_reason,refund_reason,after_sales_reason
field.reason.label=具体原因
field.afterSalesType.aliases=afterSalesType,after_sales_type,request_type
field.afterSalesType.label=售后类型
field.afterSalesType.allowed=退货,换货,维修
