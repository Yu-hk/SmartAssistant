# Product feature vocabulary and clarification policy.
# Aliases can be extended without changing parser or validator classes.
preference.portability.kind=qualitative
preference.portability.aliases=便携,轻便,易携带
preference.business.kind=qualitative
preference.business.aliases=商务,商务办公,商务风格

feature.weight.kind=quantitative
feature.weight.aliases=重量
feature.weight.units=kg,千克,公斤,克,g
feature.weight.unsupported-units=斤,磅,lb,lbs
feature.weight.form-field=weight
feature.weight.missing=可接受的重量上限（例如重量不超过1.3公斤）
feature.weight.multiple=唯一的重量上限
feature.weight.unsupported=重量仅支持明确的单一上限，请确认其他重量条件

feature.battery.kind=quantitative
feature.battery.aliases=续航时间,续航
feature.battery.units=小时,h
feature.battery.unsupported-units=分钟,天,日
feature.battery.missing=最低续航时长（例如续航至少10小时）
feature.battery.multiple=唯一的续航下限
feature.battery.scenario-missing=一种续航测试场景（视频播放、开/关降噪听歌或综合使用）
feature.battery.scenario.video-playback.aliases=视频播放,看视频
feature.battery.scenario.audio-anc-on.aliases=开启降噪听歌,打开降噪听歌,开着降噪听歌,开启主动降噪听歌,打开主动降噪听歌,开着主动降噪听歌,开启降噪音乐,打开降噪音乐,开着降噪音乐
feature.battery.scenario.audio-anc-off.aliases=关闭降噪听歌,关掉降噪听歌,不开降噪听歌,关闭主动降噪听歌,关掉主动降噪听歌,不开主动降噪听歌,关闭降噪音乐,关掉降噪音乐,不开降噪音乐
feature.battery.scenario.mixed-use.aliases=综合使用,混合使用

feature.noise-cancelling.kind=boolean
feature.noise-cancelling.aliases=主动降噪,降噪
feature.noise-cancelling.non-equivalent-aliases=通话降噪,被动降噪
feature.noise-cancelling.explicit-false-aliases=不支持主动降噪,没有主动降噪
feature.noise-cancelling.missing=是否要求主动降噪（通话或被动降噪不能替代）

validation.non-positive=大于0的重量或续航数值
validation.upper-bound=合理范围内的重量或续航数值
validation.unit=明确使用公斤、克或小时等受支持的单位
validation.alternative=是否需要同时满足这些条件（目前不自动解释二选一条件）
clarification.prefix=为了帮您准确筛选，还想确认一下
clarification.battery-scenario-note=不同续航测试场景不能直接比较。
