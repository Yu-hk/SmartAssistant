server.shutdown: graceful  # ⭐ 优雅关闭，等待处理中的请求完成
spring.lifecycle.timeout-per-shutdown-phase: "30s"
server:
  port: 8083

embedding:
  service:
    url: ${EMBEDDING_SERVICE_URL:http://localhost:8091}
  local:
    enabled: ${EMBEDDING_LOCAL_ENABLED:false}

spring:
  # ⭐ JDK 21 虚拟线程：每请求一线程 + @Async/@Scheduled 默认走虚拟线程（I/O 阻塞型服务收益显著）
  threads:
    virtual:
      enabled: true
  application:
    name: router-service

  # 加载版本化规划 Skill；具体 Skill 由 BGE 意图检索结果按请求选择。
  config:
    import: classpath:skill-packages.yml
  
  # 禁用 Spring Cloud 兼容性检查（Spring Boot 3.4.x 需要）
  cloud:
    compatibility-verifier:
      enabled: false
    # ⭐ 禁用 Nacos Config 导入检查
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:127.0.0.1:8848}
        namespace: ""
        group: DEFAULT_GROUP
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
        enabled: true  # 网关 lb://router-service 依赖标准服务注册；A2A 发现仅负责 Agent 元数据

  # 数据源配置（PostgreSQL 统一数据库）
  datasource:
    url: jdbc:postgresql://localhost:5433/a2a_system
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}  # ⚠️ 必须设置 POSTGRES_PASSWORD 环境变量
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  # RabbitMQ：工作流恢复命令使用发布确认和持久化队列
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  # Redis 配置（会话上下文、checkpoint、恢复去重与执行租约）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD}  # ⚠️ 必须设置 REDIS_PASSWORD 环境变量
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
  # MyBatis 配置
  mybatis:
    mapper-locations: classpath:mapper/*.xml
    type-aliases-package: com.example.smartassistant.router.model
    configuration:
      map-underscore-to-camel-case: true  # 自动转换下划线到驼峰
      log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # 启用 SQL 日志

  # 禁用未使用的 DashScope 自动配置（Router 直连 DeepSeek API）。
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAsyncToolCallingManagerAutoConfiguration

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
    # 生产环境直接调用 DeepSeek API，不依赖本地 Ollama。
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
          temperature: 0.1

    alibaba:
      a2a:
        # Nacos 配置（服务发现）
        nacos:
          server-addr: 127.0.0.1:8848
          discovery:
            enabled: true
            namespace: ""  # 使用默认 namespace (public)
            group: DEFAULT_GROUP

# Tool Registry-owned script tool limits used by the Router fallback agent.
sandbox:
  script:
    enabled: true
    timeout-ms: 2000
    max-script-length: 2000
    max-lines: 50
    max-variables: 50
    max-expression-length: 200
    max-output-length: 8000

tool-registry:
  url: ${TOOL_REGISTRY_URL:http://smart-tool-registry:8088}

# ⭐ G3 Tier 多模型路由配置（统一模型接入层）
# 前缀 `tier` → 绑定 common.TieredModelRouterProperties
# 模型名仅由环境配置，Router/Common 不绑定具体供应商。
tier:
  light:
    model: ${MODEL_LIGHT:${DEEPSEEK_LIGHT_MODEL:deepseek-v4-flash}}
    temperature: 0.1
  standard:
    model: ${MODEL_STANDARD:${DEEPSEEK_STANDARD_MODEL:deepseek-v4-flash}}
    temperature: 0.3
  heavy:
    model: ${MODEL_HEAVY:${DEEPSEEK_REASONING_MODEL:deepseek-v4-pro}}
    temperature: 0.2
  # 意图维度覆盖：命中这些意图标签时强制升档到指定 tier（绕过复杂度分类）
  intent-overrides:
    refund_complaint: HEAVY  # 退款投诉类 → 强模型确保严谨
    travel_plan: HEAVY       # 多跳旅行规划 → 强模型
  degradation-enabled: true  # 启用平滑降级（HEAVY→STANDARD→LIGHT，LIGHT 永为兜底）

  # ⭐ 灰度发布（canary）：安全试接新模型
  # 按比例切流到 canary-model，命中灰度的请求优先走新模型，
  # 失败自动回退到上述三档降级链，不影响整体可用性。
  canary-ratio: 0.0                  # 0.0=关闭；0.1=10% 流量试接新模型；1.0=全量新模型
  canary-model: ${MODEL_CANARY:}     # 灰度模型名，空值不启用
  canary-temperature: 0.3            # 灰度模型温度

# JWT 配置（与 Consumer Service 保持一致）
jwt:
  secret: ${JWT_SECRET}  # ⭐ 从环境变量 JWT_SECRET 读取。⚠️ 必须设置 JWT_SECRET 环境变量，启动失败即表示未配置

# ⭐ Nacos A2A Registry 配置（AgentCard 元数据发现）
# 启用后，Router 通过 AiService 订阅 Agent 的 AgentCard 变更，
# 获取结构化元数据（skills/description/version）。
# 与现有 AgentDiscoveryService（基于 NamingService）分工不同：
#   Naming → 服务实例发现（IP:Port 变动）
#   A2A   → Agent 元数据发现（AgentCard 技能/版本变更）
nacos:
  a2a:
    discovery:
      enabled: false

# Router 配置
router:
  # 旧经验库不再参与路由，默认停止自动提取和向量写入。
  # 仅兼容部署需要导出历史经验时才显式开启。
  experience-learning:
    enabled: ${ROUTER_EXPERIENCE_LEARNING_ENABLED:false}
  task-analysis:
    enabled: true
    # 当前用户原始提问达到该长度时使用 V4 Pro，否则使用 V4 Flash。
    pro-min-chars: ${DEEPSEEK_PRO_MIN_CHARS:${DEEPSEEK_REASONER_MIN_CHARS:160}}
    # 每个请求只使用按长度选中的一个模型；失败后进入有界任务规划，不串行等待第二个模型。
    pro-timeout-ms: ${DEEPSEEK_PRO_TIMEOUT_MS:35000}
    flash-timeout-ms: ${DEEPSEEK_FLASH_TIMEOUT_MS:30000}
  task-planner:
    timeout-ms: ${DEEPSEEK_TASK_PLANNER_TIMEOUT_MS:35000}
    max-tokens: ${DEEPSEEK_TASK_PLANNER_MAX_TOKENS:2048}
  user-profile:
    # Consumer starts profile preparation before Router planning; only Product waits here.
    wait-timeout-ms: ${ROUTER_USER_PROFILE_WAIT_TIMEOUT_MS:10000}
    poll-interval-ms: ${ROUTER_USER_PROFILE_POLL_INTERVAL_MS:25}

  # ⭐ Agent 发现配置（消除硬编码）
  agent-discovery:
    enabled: true  # 是否启用自动发现
    
    # 需要监听的服务列表（为空则使用动态发现模式）
    watched-services:
    
    # 服务名称后缀过滤规则
    service-name-suffixes:
      - "-service"
      - "-agent"
    
    # 需要排除的服务名称列表
    excluded-services:
      - router-service
      - user-service
      - consumer-service
    
    # Nacos 配置
    namespace: ""
    group: DEFAULT_GROUP
    
    # 超时配置
    discovery-timeout: 5000           # 发现超时时间（毫秒）
    cache-refresh-interval: 3600000   # 缓存刷新间隔（1小时）
    heartbeat-timeout: 120000         # 心跳超时时间（2分钟）
  
  agent:
    # 动态刷新配置
    refresh:
      enabled: true          # 启用定时刷新
      interval: 10000       # 刷新间隔（毫秒），默认 5 分钟
    
    # RAG 增强配置
    rag:
      enabled: true  # ⭐ 启用 RAG 增强路由
      top-k: 3
      similarity-threshold: 0.7

      # ⭐ P1 确定性护栏：高风险问题强制走 RAG + 跳过短路
      guardrails:
        enabled: true                # 是否启用确定性护栏
        skip-short-circuit: true     # 护栏触发时跳过经验/关键词短路
        force-rag: true              # 护栏触发时强制 RAG 增强
        enforced-terms:              # 强制触发 RAG 的关键词（命中任意一个即触发）
          - "退款"
          - "退货"
          - "取消订单"
          - "发票"
          - "投诉"
          - "理赔"
          - "售后"
          - "退钱"
          - "赔偿"
          - "申诉"
          - "举报"
        enforced-intents:            # 强制触发 RAG 的意图标签
          - "REFUND"
          - "CANCEL"
          - "COMPLAINT"
    
    # 路由决策配置
    routing:
      confidence-threshold: 0.8  # 最低置信度阈值
      max-retries: 2             # 最大重试次数

    # ⭐ P4 Hot Agent + 调度配置（默认关闭）
    scheduler:
      enabled: false                  # 灰度开关；开启后 READ 节点通过 Redis 可靠队列调度
      read-only-only: true            # 写节点保持同步，避免审批和副作用越过当前图事务
      worker-count: 4                 # Worker 线程数
      poll-timeout: 1                 # 必须短于 Redis 客户端命令超时，空队列不应记为异常
      wait-timeout-ms: 65000          # LangGraph 等待节点结果的上限
      hot-pool-enabled: false         # 可选附加消费池，默认避免重复扩容
      hot-agents: ${ROUTER_HOT_AGENTS:} # agent:priority，逗号分隔；空值时不预设业务类型
      max-concurrency-per-agent: ${ROUTER_AGENT_MAX_CONCURRENCY:4}

    # ⭐ 语义路由缓存配置
    semantic-cache:
      enabled: true              # 是否启用语义路由缓存
      reply-cache-enabled: true  # ⭐ P3-B：最终回复缓存总开关。false 则不缓存任何最终回复
                                 #    （路由决策仍缓存），以完全对齐文章⑥"不缓存可变最终回答"的建议。
                                 #    回复 key 已含 租户+索引版本 作用域，防跨租户泄露 + 知识更新失效。
    
    # ⭐ 关键词提取缓存（已被多 Agent 协作替代）
    keyword-extraction:
      cache:
        max-size: 1000  # 根据内存调整
        ttl: 3600       # 可选：设置过期时间
  
  # ⭐ 中文分词器配置（IKAnalyzer）
  tokenizer:
    enabled: true              # 是否启用中文分词器增强
    use-ik-analyzer: true      # 是否使用 IKAnalyzer

  # ⭐ 反思器配置（纯规则评分，不调 LLM）
  reflection:
    enabled: true              # 是否启用反思器（灰度开关）
    threshold: 0.60            # 质量评分阈值（0.0~1.0，低于此值触发重试）
    max-retry: 1               # 最大重试次数（换 fallback Agent）
    criteria-fail-open: false  # 验收 Judge 故障时不静默放行，由节点重试处理

  # LLM-as-Judge 最终回答质量门禁
  quality-evaluation:
    enabled: true
    threshold: 0.60
    reflection-lower-bound: 0.50
    reflection-upper-bound: 0.80
    max-evaluation-length: 6000
    fail-closed: true          # Judge 调用/解析失败时返回安全降级回复，不缓存、不提取经验
    failure-message: "抱歉，我暂时无法可靠地回答这个问题。请补充更多信息或稍后重试。"

  graph:
    # LangGraph4j is the sole engine; native checkpoints and handoffs are always enabled.
    max-replans: 1             # 单次 Graph 执行的全局重规划预算
    max-criteria-corrections: 1 # 非空结果验收失败时，仅定向修正一次
    recovery:
      enabled: ${ROUTER_GRAPH_RECOVERY_ENABLED:false} # 未部署 RabbitMQ 时安全关闭；生产 Compose 显式开启
      broker: rabbit            # rabbit 为生产默认值；redis 仅保留为紧急回滚适配器
      scan-interval-ms: 30000
      stale-after-ms: 120000    # 超过两个节点调用超时后才判定为失联
      execution-lease-ms: 90000 # 活跃 Router 持续续租，进程崩溃后自动过期
      visibility-timeout-ms: 120000
      scan-batch-size: 100
      worker-count: 2
      idle-poll-ms: 250
      max-retries: 3
      dedup-ttl-ms: 60000
      message-ttl-ms: 7200000
      rabbit:
        exchange: smartassistant.workflow
        queue: smartassistant.workflow.recovery
        routing-key: workflow.recovery
        dead-letter-exchange: smartassistant.workflow.dlx
        dead-letter-queue: smartassistant.workflow.recovery.dlq
        dead-letter-routing-key: workflow.recovery.dead
        retry-delays: 1s,5s,30s
        confirm-timeout: 5s

  context:
    history:
      max-messages: 10
      ttl-seconds: 3600

# Actuator + Prometheus + Tracing 配置 ⭐
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  health:
    # Spring AMQP is on the classpath even when workflow recovery is disabled.
    # Avoid turning the whole Router health endpoint DOWN on deployments
    # that intentionally do not provision RabbitMQ.
    rabbit:
      enabled: ${ROUTER_GRAPH_RECOVERY_ENABLED:false}
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  
  # 分布式追踪配置 (Jaeger - Zipkin 兼容模式)
  tracing:
    sampling:
      probability: 0.3  # ⭐ 采样率 30%（开发环境已足够，生产环境可调整为 0.1）
    zipkin:
      tracing:
        endpoint: http://localhost:9411/api/v2/spans  # ⭐ Jaeger 兼容 Zipkin 协议的端点

# Logging 配置（输出到文件，供 Loki 收集）⭐
logging:
  charset:
    file: UTF-8
    console: UTF-8
  file:
    name: logs/${spring.application.name}.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

# ⭐ Resilience4j 重试 + 熔断配置
resilience4j:
  circuitbreaker:
    instances:
      # ⭐ Agent HTTP 调用熔断器 — 解决"通信越可靠异常越多"的反常识问题
      agentCall:
        sliding-window-size: 10              # 滑动窗口（10个请求）
        sliding-window-type: COUNT_BASED     # 基于计数
        minimum-number-of-calls: 5           # 最少5次才触发判断
        failure-rate-threshold: 50           # 失败率超过50%熔断
        wait-duration-in-open-state: 30s     # 30s后尝试半开
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.lang.RuntimeException       # 捕获 callAgentAndExtractTitles 抛出的失败异常
  retry:
    instances:
      modelRoutingRetry:
        max-attempts: 3                  # 最多重试 3 次
        wait-duration: 200ms             # 初始等待 200ms
        enable-exponential-backoff: true # 指数退避
        exponential-backoff-multiplier: 2 # 每次翻倍：200ms → 400ms → 800ms
        retry-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
      agentRetry:
        max-attempts: 2
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
