<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="760" viewBox="-20 -20 1540 760" role="img" aria-labelledby="title desc">
  <title id="title">SmartAssistant 高层运行时架构与领域执行流程</title>
  <desc id="desc">展示从用户、前端、网关到 Consumer 前置语义缓存与 Router 编排的主请求链路，以及 Product 的候选查询、三维分析与核实推荐流程，Order 的信息收集、二次确认与确定性工作流，并标明 Redis 检查点与 RabbitMQ 恢复链路。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      .canvas { fill: #fff; }
      .cluster { fill: #fbfaff; stroke: #8b5cf6; stroke-width: 1.8; rx: 12; }
      .cluster.order { fill: #f8fbff; stroke: #3b82f6; }
      .cluster-title { fill: #172033; font: 700 20px "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .node rect { fill: #f7f5ff; stroke: #8b5cf6; stroke-width: 1.6; rx: 6; }
      .node.order rect { fill: #f2f7ff; stroke: #3b82f6; }
      .node.infra rect { fill: #f8fafc; stroke: #94a3b8; }
      .node.shared rect { stroke-dasharray: 6 4; }
      .primary { fill: #172033; font: 600 17px "Microsoft YaHei", "Noto Sans SC", sans-serif; text-anchor: middle; }
      .secondary { fill: #475569; font: 13px "Microsoft YaHei", "Noto Sans SC", sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #475569; stroke-width: 1.6; marker-end: url(#arrow); }
      .edge.product { stroke: #7c3aed; }
      .edge.order { stroke: #2563eb; }
      .edge.dashed { stroke: #64748b; stroke-dasharray: 5 5; }
      .label rect { fill: #fff; opacity: .96; rx: 3; }
      .label text { fill: #334155; font: 13px "Microsoft YaHei", "Noto Sans SC", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="720"/>

  <!-- 领域边界先绘制，确保流程箭头显示在边界之上 -->
  <rect class="cluster" x="950" y="50" width="520" height="220"/>
  <text class="cluster-title" x="970" y="82">Product Service · 商品查询与推荐</text>
  <rect class="cluster order" x="950" y="320" width="520" height="280"/>
  <text class="cluster-title" x="970" y="352">Order Service · 订单确定性工作流</text>

  <!-- 主请求链路 -->
  <path class="edge" d="M140 315 H175"/>
  <path class="edge" d="M305 315 H345"/>
  <path class="edge" d="M485 315 H525"/>
  <path class="edge" d="M685 315 H730"/>
  <path class="edge product" d="M890 300 C920 300 920 160 950 160"/>
  <path class="edge order" d="M890 330 C920 330 920 430 950 430"/>

  <!-- 认证、模型、工具与基础设施 -->
  <path class="edge" d="M415 280 V155"/>
  <path class="edge dashed" d="M810 280 V155"/>
  <path class="edge dashed" d="M810 350 V455"/>
  <path class="edge dashed" d="M415 610 V350"/>
  <path class="edge dashed" d="M605 350 C640 430 625 520 605 610"/>
  <path class="edge dashed" d="M770 350 H700 V645 H730"/>
  <path class="edge dashed" d="M890 645 H920 V325 H890"/>

  <!-- Product 执行流程 -->
  <path class="edge product" d="M1065 150 H1080"/>
  <path class="edge product" d="M1200 150 H1215"/>
  <path class="edge product" d="M1335 150 H1350"/>
  <path class="edge product dashed" d="M1410 185 C1410 235 1275 235 1275 185"/>
  <path class="edge dashed" d="M1140 115 V30 H1480 V670 H1380"/>

  <!-- Order 执行流程 -->
  <path class="edge order" d="M1065 425 H1080"/>
  <path class="edge order" d="M1200 425 H1215"/>
  <path class="edge order" d="M1335 425 H1350"/>
  <path class="edge order" d="M1410 460 V505 H1285"/>
  <path class="edge dashed" d="M1285 565 V640"/>

  <!-- 路径标签 -->
  <g class="label" transform="translate(325 260)"><rect x="-33" y="-12" width="66" height="20"/><text y="3">HTTPS</text></g>
  <g class="label" transform="translate(505 260)"><rect x="-37" y="-12" width="74" height="20"/><text y="3">认证/对话</text></g>
  <g class="label" transform="translate(708 260)"><rect x="-66" y="-12" width="132" height="20"/><text y="3">缓存未命中 / Route API</text></g>
  <g class="label" transform="translate(920 220)"><rect x="-38" y="-12" width="76" height="20"/><text y="3">商品意图</text></g>
  <g class="label" transform="translate(920 377)"><rect x="-38" y="-12" width="76" height="20"/><text y="3">订单意图</text></g>
  <g class="label" transform="translate(1345 220)"><rect x="-47" y="-12" width="94" height="20"/><text y="3">不一致则重析</text></g>
  <g class="label" transform="translate(650 505)"><rect x="-48" y="-12" width="96" height="20"/><text y="3">前置语义检索</text></g>
  <g class="label" transform="translate(700 560)"><rect x="-30" y="-12" width="60" height="20"/><text y="3">检查点</text></g>
  <g class="label" transform="translate(920 575)"><rect x="-36" y="-12" width="72" height="20"/><text y="3">恢复任务</text></g>

  <!-- 主链路节点 -->
  <g class="node" transform="translate(25 280)"><rect width="115" height="70"/><text class="primary" x="57.5" y="31">用户</text><text class="secondary" x="57.5" y="51">浏览器</text></g>
  <g class="node" transform="translate(175 280)"><rect width="130" height="70"/><text class="primary" x="65" y="31">React 前端</text><text class="secondary" x="65" y="51">Vite :5173</text></g>
  <g class="node" transform="translate(345 280)"><rect width="140" height="70"/><text class="primary" x="70" y="31">API Gateway</text><text class="secondary" x="70" y="51">统一接入 :8081</text></g>
  <g class="node" transform="translate(525 280)"><rect width="160" height="70"/><text class="primary" x="80" y="31">Consumer Service</text><text class="secondary" x="80" y="51">对话 · 画像 · 缓存 :8082</text></g>
  <g class="node" transform="translate(730 280)"><rect width="160" height="70"/><text class="primary" x="80" y="31">Router Service</text><text class="secondary" x="80" y="51">LangGraph4j 编排 :8083</text></g>

  <!-- 辅助服务 -->
  <g class="node infra shared" transform="translate(25 85)"><rect width="260" height="70"/><text class="primary" x="130" y="27">Common（共享代码库）</text><text class="secondary" x="130" y="47">跨服务协议 · AI 治理 · 工具契约</text><text class="secondary" x="130" y="62">模块专属配置已下沉</text></g>
  <g class="node infra" transform="translate(345 85)"><rect width="140" height="70"/><text class="primary" x="70" y="31">User Service</text><text class="secondary" x="70" y="51">JWT · 权限 :8086</text></g>
  <g class="node infra" transform="translate(730 85)"><rect width="160" height="70"/><text class="primary" x="80" y="31">AI / RAG Runtime</text><text class="secondary" x="80" y="51">LLM · Embedding :8091</text></g>
  <g class="node infra" transform="translate(730 455)"><rect width="160" height="70"/><text class="primary" x="80" y="31">Tool Registry</text><text class="secondary" x="80" y="51">发现 · 安全执行</text></g>
  <g class="node infra" transform="translate(345 610)"><rect width="140" height="70"/><text class="primary" x="70" y="31">Nacos</text><text class="secondary" x="70" y="51">服务注册发现</text></g>
  <g class="node infra" transform="translate(515 610)"><rect width="180" height="70"/><text class="primary" x="90" y="27">Redis</text><text class="secondary" x="90" y="47">会话 · 高精度语义缓存</text><text class="secondary" x="90" y="62">热门短 TTL · 文档版本失效</text></g>
  <g class="node infra" transform="translate(730 610)"><rect width="160" height="70"/><text class="primary" x="80" y="27">RabbitMQ</text><text class="secondary" x="80" y="47">过期工作流扫描</text><text class="secondary" x="80" y="62">恢复任务队列</text></g>

  <!-- Product 领域 -->
  <g class="node" transform="translate(970 115)"><rect width="95" height="70"/><text class="primary" x="47.5" y="31">Product</text><text class="secondary" x="47.5" y="51">Agent</text></g>
  <g class="node" transform="translate(1080 115)"><rect width="120" height="70"/><text class="primary" x="60" y="31">候选查询</text><text class="secondary" x="60" y="51">库存 · 价格</text></g>
  <g class="node" transform="translate(1215 115)"><rect width="120" height="70"/><text class="primary" x="60" y="27">三维分析</text><text class="secondary" x="60" y="46">销量 · 性价比</text><text class="secondary" x="60" y="62">口碑 + 用户偏好</text></g>
  <g class="node" transform="translate(1350 115)"><rect width="100" height="70"/><text class="primary" x="50" y="27">核实推荐</text><text class="secondary" x="50" y="46">事实校验</text><text class="secondary" x="50" y="62">输出结论</text></g>

  <!-- Order 领域 -->
  <g class="node order" transform="translate(970 390)"><rect width="95" height="70"/><text class="primary" x="47.5" y="31">Order</text><text class="secondary" x="47.5" y="51">Agent</text></g>
  <g class="node order" transform="translate(1080 390)"><rect width="120" height="70"/><text class="primary" x="60" y="31">补齐信息</text><text class="secondary" x="60" y="51">参数 · 槽位</text></g>
  <g class="node order" transform="translate(1215 390)"><rect width="120" height="70"/><text class="primary" x="60" y="31">用户二次确认</text><text class="secondary" x="60" y="51">写操作门禁</text></g>
  <g class="node order" transform="translate(1350 390)"><rect width="100" height="70"/><text class="primary" x="50" y="31">确定性执行</text><text class="secondary" x="50" y="51">幂等 · 审批</text></g>
  <g class="node order" transform="translate(1165 505)"><rect width="240" height="60"/><text class="primary" x="120" y="27">创建订单 · 支付 · 退单</text><text class="secondary" x="120" y="46">物流查询 · 售后申请 · 状态流转</text></g>

  <g class="node infra" transform="translate(1200 640)"><rect width="180" height="60"/><text class="primary" x="90" y="27">PostgreSQL · pgvector</text><text class="secondary" x="90" y="46">商品 · 订单 · 用户 · 向量</text></g>
</svg>
