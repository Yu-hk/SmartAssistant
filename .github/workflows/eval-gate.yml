name: RAG / Agent Evaluation Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  offline-reactor-baseline:
    name: Audited offline reactor baseline (two clean runs)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check inventory, report and process cleanup contracts
        run: python3 -m unittest discover -s scripts -p 'test_offline*.py' -v
      - name: Populate dependencies and the dynamically resolved JUnit provider
        run: |
          # Cache the clean lifecycle plugin as well as compile/install plugins.
          mvn -B -DskipTests clean install
          # Common adds a repository; also cache the launcher in the root-only
          # repository context instead of assuming a downloaded file is usable.
          mvn -B -pl smart-assistant-common,smart-assistant-routing-contract -Dtest=EmbeddingClientTest,RoutingKeysTest test
      - name: First clean measurement (no model or storage credentials)
        run: python3 scripts/run_offline_baseline.py --output .codex-output/offline-baseline/first
      - name: Independent clean repeat and counter comparison
        run: python3 scripts/run_offline_baseline.py --output .codex-output/offline-baseline/second --compare .codex-output/offline-baseline/first/baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-reactor-baseline
          path: .codex-output/offline-baseline/
          include-hidden-files: true
          if-no-files-found: error

  ragas-feedback-contract:
    name: Ragas four-metric and shadow-feedback contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_ragas_feedback.py -v
      - run: python -m unittest discover -s scripts -p test_ragas_shadow_replay.py -v
      - run: python -m unittest discover -s scripts -p test_ragas_answer_audit.py -v
      - run: python -m unittest discover -s scripts -p test_retrieval_calibration.py -v
      - run: python -m unittest discover -s scripts -p test_native_retrieval_calibration.py -v
      - run: python -m unittest discover -s scripts -p test_anchored_retrieval_calibration.py -v
      - run: python -m unittest discover -s scripts -p 'test_bounded_feedback*.py' -v
      - run: python -m unittest discover -s scripts -p 'test_knowledge_guard_*.py' -v

  embedding-service-contract:
    name: Embedding service HTTP, startup and lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated embedding service and remote adapter contracts
        run: >-
          mvn -B -pl smart-assistant-embedding-service -am clean test
          -Dtest=EmbeddingControllerContractTest,EmbeddingApplicationContextTest,EmbeddingApplicationLifecycleTest,EmbeddingClientTest,RemoteBgeEmbeddingModelTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Require every selected suite without failures, errors or skips
        run: |
          python3 scripts/verify_integration_reports.py smart-assistant-embedding-service/target/surefire-reports/TEST-com.example.smartassistant.embedding.EmbeddingControllerContractTest.xml --minimum 32
          python3 scripts/verify_integration_reports.py smart-assistant-embedding-service/target/surefire-reports/TEST-com.example.smartassistant.embedding.EmbeddingApplicationContextTest.xml --minimum 4
          python3 scripts/verify_integration_reports.py smart-assistant-embedding-service/target/surefire-reports/TEST-com.example.smartassistant.embedding.EmbeddingApplicationLifecycleTest.xml --minimum 3
          python3 scripts/verify_integration_reports.py smart-assistant-common/target/surefire-reports/TEST-com.example.smartassistant.common.embedding.EmbeddingClientTest.xml --minimum 1
          python3 scripts/verify_integration_reports.py smart-assistant-common/target/surefire-reports/TEST-com.example.smartassistant.common.embedding.RemoteBgeEmbeddingModelTest.xml --minimum 1
      - name: Enforce measured embedding class coverage floors
        run: |
          python3 scripts/verify_jacoco_class.py smart-assistant-embedding-service/target/site/jacoco/jacoco.xml com/example/smartassistant/embedding/EmbeddingController --instruction-minimum 0.95 --branch-minimum 0.90
          python3 scripts/verify_jacoco_class.py smart-assistant-embedding-service/target/site/jacoco/jacoco.xml com/example/smartassistant/embedding/EmbeddingApplication --instruction-minimum 0.80 --branch-minimum 0.90
      - name: Test embedding artifact, release and probe contracts offline (no production access)
        run: python3 -m unittest discover -s scripts -p 'test_embedding*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedding-service-contract-reports
          path: |
            smart-assistant-embedding-service/target/surefire-reports/
            smart-assistant-embedding-service/target/site/jacoco/
            smart-assistant-common/target/surefire-reports/TEST-com.example.smartassistant.common.embedding.*.xml
            smart-assistant-common/target/site/jacoco/
          if-no-files-found: error

  product-entity-contract:
    name: Product entity and constraint golden contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: >-
          mvn -B -pl smart-assistant-product,smart-assistant-data-intake -am test
          -Dtest=BoundedRetrievalFeedbackTest,ProductRagServiceAgenticTest,KnowledgeSearchHandlerScopeTest,ProductEntityResolverTest,ProductEntityEvaluationTest,ProductEntityCoverageTest,ProductFieldCoverageTest,ProductRetrievalDiagnosticsTest,RerankHandlerTest,StreamingProductAgentServiceTest,ProductConversationHistoryTest,JevProductEntityAdvisorTest,JdbcProductIdentityTest,ProductIdentityUpdateTest,AdminProductIdentityControllerTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Compile standalone retrieval calibration probe
        run: |
          mvn -B -pl smart-assistant-common dependency:build-classpath -Dmdep.outputFile=target/calibration-classpath.txt
          python3 scripts/prepare_retrieval_calibration.py --classpath-file smart-assistant-common/target/calibration-classpath.txt --common-classes smart-assistant-common/target/classes --product-classes smart-assistant-product/target/classes --output smart-assistant-common/target/retrieval-calibration
          java -cp 'smart-assistant-common/target/retrieval-calibration:smart-assistant-common/target/retrieval-calibration/classpath.jar' NativeRetrievalCalibrationProbe --coverage-contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-entity-golden-contract
          path: |
            smart-assistant-product/target/product-entity-metrics.json
            smart-assistant-product/target/product-entity-coverage.json
            smart-assistant-product/target/surefire-reports/TEST-*Entity*.xml
            smart-assistant-data-intake/target/surefire-reports/TEST-*Identity*.xml
          if-no-files-found: error

  database-bootstrap-restore:
    name: PG16 bootstrap and logical restore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_database_*py' -v
      - run: python -m unittest discover -s scripts -p test_recovery_baseline.py -v
      - run: docker pull pgvector/pgvector:0.8.0-pg16
      - run: python scripts/database_bootstrap_drill.py --repo . --image pgvector/pgvector:0.8.0-pg16 --report database-bootstrap-report.json
      - run: python scripts/database_bootstrap_drill.py --repo . --image pgvector/pgvector:0.8.0-pg16 --with-migrations --report database-upgrade-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg16-bootstrap-restore
          path: |
            database-bootstrap-report.json
            database-upgrade-report.json
          if-no-files-found: error

  retrieval-probe-contract:
    name: Real retrieval probe contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mvn -B -f smart-assistant-common/pom.xml package dependency:build-classpath -DskipTests -Dmdep.outputFile=target/eval-classpath.txt
      - run: mvn -B -f smart-assistant-common/pom.xml test -Dtest=KnowledgeSeedDataValidityTest,InMemoryKnowledgeBaseBulkIndexTest,InMemoryKnowledgeBaseAclTest
      - run: python scripts/prepare_rag_probe.py --classpath-file smart-assistant-common/target/eval-classpath.txt --classes smart-assistant-common/target/classes --output smart-assistant-common/target/rag-probe
      - run: python -m unittest discover -s scripts -p test_rag_probe.py -v
        env:
          RAG_PROBE_JAVA_ARGS: smart-assistant-common/target/rag-probe/java.args
      - run: javac -d smart-assistant-common/target/rag-probe scripts/java/ContainerDnsProbe.java
      - run: python -m unittest discover -s scripts -p test_container_dns_probe.py -v
        env:
          DNS_PROBE_CLASSES: smart-assistant-common/target/rag-probe

  customer-reply-style:
    name: Customer reply style and safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: >-
          mvn -B -pl smart-assistant-consumer,smart-assistant-product,smart-assistant-order,smart-assistant-router -am test
          -Dtest=CustomerReplyStyleTest,PromptBuilderTest,UserDocumentQaServiceTest,SentimentAnalysisServiceTest,OrderDeterministicExecutionServiceTest,OrderRagServiceTest,ProductCustomerServicePromptTest,ProductStreamControllerTest,StreamingProductAgentServiceTest,StructuredProductRecommendationTest,ProductDiscoveryServiceTest,ProductFollowUpConstraintsTest,ProductStructuredFeaturesTest,PolicyPlanGuardTest,ResultMergerTest,ChatDispatchListenerTest,RouterClientDnsRetryTest,SelectiveSemanticAnswerCacheTest,TaskAnalysisPromptTest,RouteExecutionPreplannedGraphTest,GraphNodeExecutionServiceTest,RouterConversationContextTest,ProductNodeResultCacheTest,ModelCallFailureTest,ProductFactQueryServiceTest,MultiProductQueryServiceTest,ProductReadOnlyDispatcherTest,BusinessFallbackParserTest,ModelUnavailableWorkflowServiceTest,LangGraphRouteExecutionServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - run: python3 scripts/verify_integration_reports.py smart-assistant-product/target/surefire-reports/TEST-com.example.smartassistant.service.core.StructuredProductRecommendationTest.xml --minimum 40
      - run: python3 -m unittest discover -s scripts -p test_result_merger_patch.py -v
      - run: python3 scripts/verify_integration_reports.py smart-assistant-router/target/surefire-reports/TEST-com.example.smartassistant.router.service.taskanalysis.PolicyPlanGuardTest.xml --minimum 3
      - run: python3 scripts/verify_integration_reports.py smart-assistant-router/target/surefire-reports/TEST-com.example.smartassistant.router.service.core.ResultMergerTest.xml --minimum 13
      - run: python3 scripts/verify_integration_reports.py smart-assistant-router/target/surefire-reports/TEST-com.example.smartassistant.router.service.core.RouteExecutionPreplannedGraphTest.xml --minimum 31
      - run: >-
          mvn -B -pl smart-assistant-consumer,smart-assistant-product,smart-assistant-order,smart-assistant-router -am test
          -Dtest=ClarificationV2Test,DomainClarificationRelayTest,OrderClarificationServiceTest,OrderFallbackPreparationServiceTest,OrderAgentControllerTest,StageAwarePromptServiceTest,AgentCallerPreparationBoundaryTest,ProductClarificationScopeTest
          -Dsurefire.failIfNoSpecifiedTests=false

  profile-governance:
    name: Profile provenance and memory isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: >-
          mvn -B -pl smart-assistant-consumer,smart-assistant-product,smart-assistant-order,smart-assistant-router -am test
          -Dtest=AgentFlowTraceStoreTest,PromptAuditAdvisorTest,TokenUsageAdvisorAuditTest,UserGroupingServiceTest,GovernedAgentMemoryTest,OrderAgentControllerTest,ProfileAdmissionCoordinatorTest,EntityProfileGenerationTest,EntityProfileServiceTest,ProfileGovernanceTest,UserProfileQueryServiceTest,AgentMemoryServiceIntegrationTest,AgentMemoryFileConcurrencyTest,MemoryExtractorOptionalModelTest,UserProfilePrefetchTest,UserProfileSnapshotStoreTest,UserProfileCommitMessagingTest,ProfileCommitReferenceTest,ProfileGenerationServiceTest,ProfileGenerationFenceTest,UserProfileContextAwaiterTest,ProfileExecutionConfigTest,GraphNodeExecutionServiceTest,ProductSkillPackageConfigurationTest,OrderSkillPackageConfigurationTest,ProductBudgetRevisionTest,LightChatModelConfigTest,LLMPreferenceExtractorTest,RouterClientDnsRetryTest,ChatDispatchListenerTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - run: python3 scripts/verify_integration_reports.py smart-assistant-common/target/surefire-reports/TEST-com.example.smartassistant.common.memory.AgentMemoryFileConcurrencyTest.xml --minimum 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-governance-reports
          path: '**/target/surefire-reports/*.xml'

  project-context:
    name: Repository facts and governance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_project_context.py
      - run: python -m unittest discover -s scripts -p 'test_project_context.py' -v
      - run: python -m unittest discover -s scripts -p 'test_integration_reports.py' -v
      - run: python -m unittest discover -s scripts -p 'test_eval_rag.py' -v
      - run: python -m unittest discover -s scripts -p 'test_server_rag_evaluation.py' -v
      - run: python -m unittest discover -s scripts -p 'test_container_dns_policy.py' -v
      - run: python -m unittest discover -s scripts -p 'test_release_artifacts.py' -v
      - run: python -m unittest discover -s scripts -p 'test_profile_restore_drill.py' -v
      - run: python -m unittest discover -s scripts -p 'test_profile_backup_catalog.py' -v
      - run: python -m unittest discover -s scripts -p 'test_profile_archive_inventory.py' -v
      - run: python -m unittest discover -s scripts -p 'test_profile_storage_inventory.py' -v
      - run: python -m unittest discover -s scripts -p 'test_profile_control_checkpoint.py' -v
      - run: python -m unittest discover -s scripts -p 'test_profile_control_outbox.py' -v
      - run: python -m unittest discover -s scripts -p 'test_profile_control_recovery.py' -v
      - run: python -m unittest discover -s scripts -p 'test_profile_log_ownership_audit.py' -v
      - run: python -m unittest discover -s scripts -p 'test_profile_production_config.py' -v
      - name: Synthetic offline PostgreSQL backup restore drill
        run: |
          docker pull pgvector/pgvector:0.8.0-pg16
          python scripts/profile_restore_drill.py --image pgvector/pgvector:0.8.0-pg16
          python scripts/profile_control_recovery_drill.py --image pgvector/pgvector:0.8.0-pg16

  profile-privacy-auth:
    name: Profile deletion authentication and UI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: >-
          mvn -B -pl smart-assistant-consumer,smart-assistant-gateway -am test
          -Dtest=ProfilePrivacyAuthenticationTest,ProfilePrivacyControllerTest,UserRouteConfigurationTest,GlobalJwtAuthFilterTest,SentimentExecutionConfigTest
          -Dsurefire.failIfNoSpecifiedTests=false

  react-behavior-baseline:
    name: ReAct ordered behavior baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: >-
          mvn -B -pl smart-assistant-common -am test
          -Dtest=LoopGuardServiceTest,SmartReActAgentBehaviorBaselineTest,SmartReActAgentToolCallbackTest,SmartReActAgentChatClientTest,SmartReActAgentPhaseGateTest,SmartReActAgentGradingTest,AgentLoopDecisionTest,AgentExecutionBudgetTest,AgentToolExecutorTest,AgentToolExecutorConcurrencyTest,ModelCallFailureTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - run: python3 scripts/verify_integration_reports.py smart-assistant-common/target/surefire-reports/TEST-com.example.smartassistant.common.agent.SmartReActAgentBehaviorBaselineTest.xml --minimum 18
      - run: python3 scripts/verify_integration_reports.py smart-assistant-common/target/surefire-reports/TEST-com.example.smartassistant.common.agent.LoopGuardServiceTest.xml --minimum 54
      - run: python3 scripts/verify_integration_reports.py smart-assistant-common/target/surefire-reports/TEST-com.example.smartassistant.common.agent.AgentToolExecutorConcurrencyTest.xml --minimum 11
      - run: python3 scripts/verify_integration_reports.py smart-assistant-common/target/surefire-reports/TEST-com.example.smartassistant.common.agent.AgentExecutionBudgetTest.xml --minimum 10
      - run: python3 -m unittest discover -s scripts -p test_customer_acceptance.py -v

  storage-broker-integration:
    name: Real PostgreSQL and RabbitMQ contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: smartassistant_integration
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration-test-only
        ports: ['15433:5432']
        options: >-
          --health-cmd "pg_isready -U integration -d smartassistant_integration"
          --health-interval 3s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: integration
          RABBITMQ_DEFAULT_PASS: integration-test-only
        ports: ['15673:5672']
        options: >-
          --health-cmd "su-exec rabbitmq rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_TEST_URL: jdbc:postgresql://127.0.0.1:15433/smartassistant_integration
      PG_TEST_USER: integration
      PG_TEST_PASSWORD: integration-test-only
      CHAT_DISPATCH_TEST_RABBIT_PORT: '15673'
      CHAT_DISPATCH_TEST_RABBIT_USERNAME: integration
      CHAT_DISPATCH_TEST_RABBIT_PASSWORD: integration-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run actual storage and fair-share contracts (no skip on failure)
        run: >-
          mvn -B -pl smart-assistant-consumer -am test
          -Dtest=PgIntegrationSettingsTest,PgVectorKnowledgeBaseIntegrationTest,ChatDispatchBrokerIntegrationTest,ProfileGenerationFenceIntegrationTest,ProfileCommitCandidateIntegrationTest,ProfileCommitBrokerIntegrationTest,GovernedEntityProfileIntegrationTest,ProfileAdmissionIntegrationTest,GovernedAgentMemoryIntegrationTest
          -Dpg.integration=true -Dprofile.pg.integration=true -Dsurefire.failIfNoSpecifiedTests=false
      - name: Require executed integration suites
        run: |
          python3 scripts/verify_integration_reports.py smart-assistant-common/target/surefire-reports/TEST-com.example.smartassistant.common.rag.PgVectorKnowledgeBaseIntegrationTest.xml --minimum 7
          python3 scripts/verify_integration_reports.py smart-assistant-consumer/target/surefire-reports/TEST-com.example.smartassistant.consumer.service.dispatch.ChatDispatchBrokerIntegrationTest.xml
          python3 scripts/verify_integration_reports.py smart-assistant-consumer/target/surefire-reports/TEST-com.example.smartassistant.consumer.service.recommendation.ProfileGenerationFenceIntegrationTest.xml --minimum 7
          python3 scripts/verify_integration_reports.py smart-assistant-consumer/target/surefire-reports/TEST-com.example.smartassistant.consumer.service.recommendation.ProfileCommitCandidateIntegrationTest.xml --minimum 8
          python3 scripts/verify_integration_reports.py smart-assistant-consumer/target/surefire-reports/TEST-com.example.smartassistant.consumer.service.recommendation.ProfileCommitBrokerIntegrationTest.xml --minimum 2
          python3 scripts/verify_integration_reports.py smart-assistant-consumer/target/surefire-reports/TEST-com.example.smartassistant.consumer.service.recommendation.GovernedEntityProfileIntegrationTest.xml --minimum 10
          python3 scripts/verify_integration_reports.py smart-assistant-consumer/target/surefire-reports/TEST-com.example.smartassistant.consumer.service.recommendation.ProfileAdmissionIntegrationTest.xml --minimum 9
          python3 scripts/verify_integration_reports.py smart-assistant-consumer/target/surefire-reports/TEST-com.example.smartassistant.consumer.service.recommendation.GovernedAgentMemoryIntegrationTest.xml --minimum 10
      - name: Verify identity metadata transactions against PostgreSQL
        run: |
          mvn -B -pl smart-assistant-data-intake -am test -Dtest=AdminProductIdentityPgIntegrationTest -Didentity.pg.integration=true -Dsurefire.failIfNoSpecifiedTests=false
          python3 scripts/verify_integration_reports.py smart-assistant-data-intake/target/surefire-reports/TEST-com.example.smartassistant.intake.service.admin.AdminProductIdentityPgIntegrationTest.xml --minimum 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-broker-integration-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: error

  product-evidence-gate:
    name: Product evidence and terminal telemetry gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Verify product evidence and successful empty catalogs
        run: >-
          mvn -B -pl smart-assistant-product -am test
          -Dtest=ProductStructuredFeaturesTest,JdbcProductFeaturesTest,StructuredProductRecommendationTest,ProductRecommendationSafetyTest,ProductBudgetClaimVerifierTest,ProductBudgetDerivationVerifierTest,PromptManagerDataAnalysisTest,ProductPriceFaithfulnessTest,HallucinationDetectorTest,FaithfulnessGuardTest,ContextFaithfulnessCheckerTest,ProductToolEvidenceScopeTest,ProductStreamControllerTest,StreamingProductAgentServiceTest,ProductDomainQualityValidatorTest,ProductToolsTest,ProductDiscoveryServiceTest,JdbcProductBackendTest,InMemoryProductBackendTest,ProductCustomerServicePromptTest,ProductSkillPackageConfigurationTest,ProductPublicAnswerTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Enforce product evidence policy coverage
        run: python3 scripts/verify_jacoco_class.py smart-assistant-product/target/site/jacoco/jacoco.xml com/example/smartassistant/service/core/ProductEvidenceResponsePolicy --instruction-minimum 0.85 --branch-minimum 0.70
      - name: Verify final SSE token selection
        run: python3 -m unittest discover -s scripts -p test_chat_telemetry.py -v
      - name: Verify persistent product features and management authorization
        run: >-
          mvn -B -pl smart-assistant-data-intake,smart-assistant-consumer,smart-assistant-gateway -am test
          -Dtest=DataIntakeApplicationTest,DataIntakeRouteConfigurationTest,ProductFeatureExtractorTest,AdminProductIntakeTest,AdminProductFeaturePersistenceTest,AdminProductFeatureControllerTest,AdminControllerSessionAuthorizationTest,AdminServiceStorageInitializationTest,AdminServiceSessionIsolationTest,ReplyOriginTest,StreamTurnRecorderTest,StreamChatControllerPersistenceTest,GlobalJwtAuthFilterTest,VisitRecordServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false

  # 语音转写与聊天解耦：鉴权、有界音频和浏览器生命周期回归。
  voice-input-gate:
    name: Voice input and ASR boundary gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Test authenticated speech boundary
        run: >-
          mvn -B -pl smart-assistant-consumer,smart-assistant-gateway -am test
          -Dtest=SpeechRecognitionServiceTest,SpeechControllerTest,SpeechSynthesisServiceTest,SpeechOutputControllerTest,GlobalJwtAuthFilterTest,ClarificationFormTest,ClarificationV2Test,StreamChatControllerPersistenceTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Test recorder lifecycle and build frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run test:voice
          npm run test:voice-output
          npm run test:recovery
          npm run test:telemetry
          node scripts/run-session-gate-tests.mjs
          npm run test:service-entry
          node scripts/run-clarification-tests.mjs
          node scripts/run-profile-privacy-tests.mjs
          npm run test:visits
          npm run build

  session-gate:
    name: Session deletion and Redis concurrency gate
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: integration
          RABBITMQ_DEFAULT_PASS: integration-test-only
        ports: ['15674:5672']
        options: >-
          --health-cmd "su-exec rabbitmq rabbitmq-diagnostics -q check_running && su-exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.2.4
        ports: ['6389:6379']
        options: >-
          --health-cmd "redis-cli ping"
            --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartassistant_profile_integration
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration-test-only
        ports: ['15434:5432']
        options: >-
          --health-cmd "pg_isready -U integration -d smartassistant_profile_integration"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      RUN_REDIS_INTEGRATION_TESTS: 'true'
      TEST_REDIS_PORT: '6389'
      CHAT_DISPATCH_TEST_RABBIT_PORT: '15674'
      CHAT_DISPATCH_TEST_RABBIT_USERNAME: integration
      CHAT_DISPATCH_TEST_RABBIT_PASSWORD: integration-test-only
      PG_TEST_URL: jdbc:postgresql://127.0.0.1:15434/smartassistant_profile_integration
      PG_TEST_USER: integration
      PG_TEST_PASSWORD: integration-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Verify ownership, deletion fencing and orphan recovery
        run: >-
            mvn -B -pl smart-assistant-consumer,smart-assistant-router -am test
            -Dtest=ProfileCrossStoreRecoveryIntegrationTest,ProfilePrivacyControllerTest,ProfileLegacyFilesTest,ProfileDerivedCleanupTest,AnswerPersonalizationPrivacyTest,ConversationDocumentServiceTest,SelectiveSemanticAnswerCacheTest,ProductNodeResultCacheTest,ProfileControlJournalTest,ProfileControlArchiveIntegrationTest,AgentFlowTraceRedisIntegrationTest,ProfileCleanupServiceTest,ProfileCleanupIntegrationTest,ConversationGateServiceTest,ConversationGateRedisIntegrationTest,ProfileRequestRedisStoreTest,ProfileRequestRedisIntegrationTest,ProfileRedisPublicationIntegrationTest,ProfileProjectionReaderIntegrationTest,UserProfileContextAwaiterTest,AdminControllerSessionAuthorizationTest,AdminServiceSessionIsolationTest
            -Dprofile.pg.integration=true -Dsurefire.failIfNoSpecifiedTests=false
      - run: |
          python3 scripts/verify_integration_reports.py smart-assistant-consumer/target/surefire-reports/TEST-com.example.smartassistant.consumer.service.recommendation.ProfileRequestRedisIntegrationTest.xml --minimum 12
          python3 scripts/verify_integration_reports.py smart-assistant-consumer/target/surefire-reports/TEST-com.example.smartassistant.consumer.service.recommendation.ProfileRedisPublicationIntegrationTest.xml --minimum 4
          python3 scripts/verify_integration_reports.py smart-assistant-consumer/target/surefire-reports/TEST-com.example.smartassistant.consumer.service.recommendation.ProfileCleanupIntegrationTest.xml --minimum 13
          python3 scripts/verify_integration_reports.py smart-assistant-consumer/target/surefire-reports/TEST-com.example.smartassistant.consumer.service.recommendation.ProfileControlJournalTest.xml --minimum 9
          python3 scripts/verify_integration_reports.py smart-assistant-consumer/target/surefire-reports/TEST-com.example.smartassistant.consumer.service.recommendation.ProfileControlArchiveIntegrationTest.xml --minimum 9
          python3 scripts/verify_integration_reports.py smart-assistant-consumer/target/surefire-reports/TEST-com.example.smartassistant.consumer.service.recommendation.ProfileCrossStoreRecoveryIntegrationTest.xml --minimum 1
          python3 scripts/verify_integration_reports.py smart-assistant-router/target/surefire-reports/TEST-com.example.smartassistant.router.service.core.ProfileProjectionReaderIntegrationTest.xml --minimum 10
          python3 scripts/verify_integration_reports.py smart-assistant-router/target/surefire-reports/TEST-com.example.smartassistant.router.service.trace.AgentFlowTraceRedisIntegrationTest.xml --minimum 3

  # 全模块编译完整性检查（不含测试，最快反馈构建是否破坏）
  compile-all:
    name: Compile all modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Maven compile (all modules)
        run: mvn -B compile

  # 工具 Manifest 校验（与编译并行，校验 capabilities/outputSchema 等元数据）
  manifest-validate:
    name: Tool manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run manifest validation tests
        run: |
          mvn -B -pl smart-assistant-tool-registry -am -DskipTests install
          mvn -B -pl smart-assistant-tool-registry test -Dtest="ToolManifestValidatorTest"
      - name: Run manifest shell validator
        run: |
          chmod +x scripts/validate-tool-manifest.sh
          ./scripts/validate-tool-manifest.sh manifests

  # 评测闭环质量门禁 —— 核心回归卡点
  # 对黄金测试集执行离线 RAG 评测 + 门禁判定（阈值 + 基线回归），失败则阻断构建。
  # 纯内存计算，无需 Redis/PG 等基础设施，可在任意 Runner 确定性运行。
  eval-gate:
    name: Evaluation gate (golden suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run evaluation gate
        run: >-
          mvn -B -pl smart-assistant-common test
          -Dtest="GoldenSuiteEvalGateTest,GoldenSuiteEvalGateTrialTest,RagSearchPipelineTest,RagSearchPipelineGradingTest,AgentLoopDecisionTest,PhaseGateTest,FeedbackLogTest,UserFeedbackServiceTest,SmartReActAgentPhaseGateTest,DiscoverToolsToolSchemaTest,GlobalExceptionHandlerTest"
          -DfailIfNoTests=false
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-report
          path: smart-assistant-common/target/eval-reports/
          if-no-files-found: warn

  # 路由核心回归卡点 —— P0-④ 修复项
  # 此前 RouterServiceEndToEndTest 长期红灯却被 CI 掩盖（CI 不跑该模块单测）。
  # 本作业以纯 Mockito 注入运行，零基础设施依赖（不需要 Redis/PG/Ollama），
  # 可在任意 Runner 确定性运行，直接防止该类回归再次静默漏过。
  router-e2e-gate:
    name: Router E2E gate (mocked, no-infra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run router end-to-end test
        run: |
          mvn -B -pl smart-assistant-router -am -DskipTests install
          mvn -B -pl smart-assistant-router clean test -Dtest="RouterCancellationRecoveryTest,InterruptedLeaseCleanupTest,RouterControllerIdentityTest,RouterControllerTokenUsageTest,RouterSingleIntentFastPathTest,BgeOnnxEmbeddingServiceTest,RouteLangGraphExecutionTest,RouterCachedRouteHintTest,RouterConversationContextTest,TaskAnalysisPromptTest,ProductEntityReferencePlanGuardTest,RouteFinalizerTest,ReflectionServiceTest,QualityEvaluationServiceTest,LangGraphRouteExecutionServiceTest,GraphNodeExecutionServiceTest,LangGraphRedisCheckpointSaverTest"
      - name: Upload surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-e2e-report
          path: smart-assistant-router/target/surefire-reports/
          if-no-files-found: warn

  # 工程合规 + 覆盖率门禁 —— Phase2-②
  # Enforcer 绑在 validate 阶段，故 `mvn validate` 即触发 Java/Maven/依赖重复版本校验
  # （现有 compile-all / router-e2e-gate 等 job 也自动继承该门禁）；
  # 同时以 router 模块无 infra 单测产出 JaCoCo 覆盖率报告（在 `mvn test` 中自动采集）。
  # JaCoCo 硬门禁（check）默认关闭（jacoco.haltOnFailure=false），
  # 运行 `mvn -B verify -Djacoco.haltOnFailure=true` 时开启（需保证全量单测可跑）。
  module-boundary-gate:
    name: Product / Order module boundary gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install shared dependencies
        run: mvn -B -pl smart-assistant-product,smart-assistant-order -am -DskipTests install
      - name: Verify component scan boundaries
        run: |
          mvn -B -pl smart-assistant-product test -Dtest="ProductApplicationScanBoundaryTest,ProductJdbcStartupTest,RagProductionAutoConfigurationPrimaryTest"
          mvn -B -pl smart-assistant-order test -Dtest="OrderApplicationScanBoundaryTest"

  quality-gate:
    name: Quality gate (enforcer + jacoco)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Enforcer build-hygiene check (validate)
        run: mvn -B validate
      - name: Run router unit test with JaCoCo coverage
        run: |
          mvn -B -pl smart-assistant-router -am -DskipTests install
          mvn -B -pl smart-assistant-router clean verify -Dtest="RouterControllerIdentityTest,RouterControllerTokenUsageTest,RouterSingleIntentFastPathTest,BgeOnnxEmbeddingServiceTest,RouteLangGraphExecutionTest,RouterCachedRouteHintTest,RouteFinalizerTest,ReflectionServiceTest,QualityEvaluationServiceTest,LangGraphRouteExecutionServiceTest,GraphNodeExecutionServiceTest,LangGraphRedisCheckpointSaverTest" -Djacoco.haltOnFailure=true -Djacoco.instruction.minimum=0.14 -Djacoco.branch.minimum=0.09
      - name: Verify extracted consumer service coverage
        run: |
          python3 -m unittest discover -s scripts -p 'test_verify_jacoco_class.py'
          mvn -B -pl smart-assistant-consumer -am clean test -Dtest="AdminServiceFaqImportTest,AdminFaqServicePersistenceTest,StreamTurnRecorderTest,StreamChatControllerPersistenceTest,RedisSseProgressForwarderTest" -Dsurefire.failIfNoSpecifiedTests=false
          python3 scripts/verify_jacoco_class.py smart-assistant-consumer/target/site/jacoco/jacoco.xml com/example/smartassistant/consumer/service/admin/AdminFaqService --instruction-minimum 0.80 --branch-minimum 0.60
          python3 scripts/verify_jacoco_class.py smart-assistant-consumer/target/site/jacoco/jacoco.xml com/example/smartassistant/consumer/service/session/StreamTurnRecorder --instruction-minimum 0.80 --branch-minimum 0.65
          python3 scripts/verify_jacoco_class.py smart-assistant-consumer/target/site/jacoco/jacoco.xml com/example/smartassistant/consumer/streaming/RedisSseProgressForwarder --instruction-minimum 0.80 --branch-minimum 0.60
      - name: Upload jacoco coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-router-report
          path: smart-assistant-router/target/site/jacoco/
          if-no-files-found: warn
      - name: Upload consumer coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-consumer-services-report
          path: smart-assistant-consumer/target/site/jacoco/
          if-no-files-found: warn

# 说明：
# 1. 本工作流是「评测闭环接入 CI」的核心卡点。请在 GitHub 分支保护规则中将以下
#    状态检查设为必需（required status check），才能在 PR 中真正阻断质量回归：
#      - "Evaluation gate (golden suite)"   （common 模块金标准评测门禁）
#      - "Router E2E gate (mocked, no-infra)"（router 模块核心路由回归卡点，P0-④）
#      - "Quality gate (enforcer + jacoco)"  （Phase2-② 工程合规 + 覆盖率门禁）
# 2. 重新生成基线（仅人工确认质量变化后执行）：
#    本地运行 GoldenSuiteEvalGate.main 并将生成的 src/test/resources/eval-baseline.json 提交。
# 3. session-gate 与 storage-broker-integration 使用专用 Redis/PG/RabbitMQ service containers。
#    这些契约测试不等于全量集成测试、真实模型评测或生产多副本故障演练。
