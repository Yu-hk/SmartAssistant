# SmartAssistant - 完整服务容器化部署
# 构建：docker compose -f docker-compose.deploy.yml build
# 启动：docker compose -f docker-compose.deploy.yml up -d
#
# 注意：需先创建 .env 文件并填入真实 API Key 和密码
# ⚠️ P0-③ 修复：补齐 postgres（根基础设施栈 docker-compose.yml 未含）；
#    补全各后端服务的容器网络覆盖（数据源 / Redis / Nacos 地址）。

services:
  # ========== 基础设施 ==========
  redis:
    extends:
      file: docker-compose.yml
      service: redis

  nacos:
    extends:
      file: docker-compose.yml
      service: nacos
    # ⚠️ 本地开发部署：关闭 Nacos 鉴权。
    # Nacos 3.x 使用自定义 AuthenticationProvider，不读取初始化的 nacos 用户密码，
    # 导致所有后端注册均 401。关闭后服务侧凭据被忽略，注册正常。
    # 生产环境请改用正确的鉴权凭证并恢复 NACOS_AUTH_ENABLE=true。
    environment:
      - NACOS_AUTH_ENABLE=false

  zipkin:
    extends:
      file: docker-compose.yml
      service: zipkin

  # ⚠️ 补齐 postgres（根 docker-compose.yml 基础设施栈未含，后端服务强依赖）
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: postgres
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-a2a_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./docs/database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    command: >
      -c shared_preload_libraries=vector
      -c max_connections=200
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-a2a_system}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 后端服务 ==========
  gateway:
    build:
      context: ./smart-assistant-gateway
      dockerfile: ../deploy/Dockerfile.service
      args:
        SERVICE_NAME: smart-assistant-gateway
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD}
    depends_on:
      nacos: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${PORT:-8080}"]
      start_period: 180s
    restart: unless-stopped

  user:
    build:
      context: ./smart-assistant-user
      dockerfile: ../deploy/Dockerfile.service
      args:
        SERVICE_NAME: smart-assistant-user
    ports:
      - "8086:8086"
    environment:
      PORT: 8086
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-a2a_system}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD}
    depends_on:
      nacos: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${PORT:-8080}"]
      start_period: 180s
    restart: unless-stopped

  consumer:
    build:
      context: ./smart-assistant-consumer
      dockerfile: ../deploy/Dockerfile.service
      args:
        SERVICE_NAME: smart-assistant-consumer
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SPRING_AI_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-a2a_system}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD}
      TOOL_REGISTRY_URL: http://tool-registry:8090
      ROUTER_SERVICE_URL: http://router:8083
      # ⚠️ Ollama 容器化：覆盖 jar 内 base-url（避免重新构建），指向同网络 ollama 服务
      AI_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      nacos: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${PORT:-8080}"]
      start_period: 180s
    restart: unless-stopped

  router:
    build:
      context: ./smart-assistant-router
      dockerfile: ../deploy/Dockerfile.service
      args:
        SERVICE_NAME: smart-assistant-router
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SPRING_AI_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-a2a_system}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD}
      TOOL_REGISTRY_URL: http://tool-registry:8090
      AI_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      nacos: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${PORT:-8080}"]
      start_period: 180s
    restart: unless-stopped

  order:
    build:
      context: ./smart-assistant-order
      dockerfile: ../deploy/Dockerfile.service
      args:
        SERVICE_NAME: smart-assistant-order
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SPRING_AI_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-a2a_system}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD}
      TOOL_REGISTRY_URL: http://tool-registry:8090
      AI_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      nacos: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${PORT:-8080}"]
      start_period: 180s
    restart: unless-stopped

  product:
    build:
      context: ./smart-assistant-product
      dockerfile: ../deploy/Dockerfile.service
      args:
        SERVICE_NAME: smart-assistant-product
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SPRING_AI_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      # P0 修复：product 引入 flyway 但无迁移脚本，public 模式已有 JPA 建表；
      # 开启 baselineOnMigrate 让 flywayInitializer 正常创建（不回放不存在的迁移）。
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-a2a_system}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD}
      TOOL_REGISTRY_URL: http://tool-registry:8090
      AI_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      nacos: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${PORT:-8080}"]
      start_period: 180s
    restart: unless-stopped

  general:
    build:
      context: ./smart-assistant-general
      dockerfile: ../deploy/Dockerfile.service
      args:
        SERVICE_NAME: smart-assistant-general
    ports:
      - "8087:8087"
    environment:
      PORT: 8087
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SPRING_AI_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD}
      TOOL_REGISTRY_URL: http://tool-registry:8090
      AI_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      nacos: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${PORT:-8080}"]
      start_period: 180s
    restart: unless-stopped

  # ⭐ P0 端口冲突修复：tool-registry 由 8088 迁至 8090（与 recommend 8088 分离）
  tool-registry:
    build:
      context: ./smart-assistant-tool-registry
      dockerfile: ../deploy/Dockerfile.service
      args:
        SERVICE_NAME: smart-assistant-tool-registry
    ports:
      - "8090:8090"
    environment:
      PORT: 8090
      TOOL_REGISTRY_URL: http://tool-registry:8090
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${PORT:-8090}"]
      start_period: 180s
    restart: unless-stopped

  # ⭐ P0 端口冲突修复：recommend 容器化（端口保持 8088），经 Nacos 发现 product/order
  recommend:
    build:
      context: ./smart-assistant-recommend
      dockerfile: ../deploy/Dockerfile.service
      args:
        SERVICE_NAME: smart-assistant-recommend
    ports:
      - "8088:8088"
    environment:
      PORT: 8088
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD}
      SPRING_CLOUD_NACOS_CONFIG_IMPORT_CHECK_ENABLED: "false"
    depends_on:
      nacos: { condition: service_healthy }
      product: { condition: service_healthy }
      order: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${PORT:-8080}"]
      start_period: 180s
    restart: unless-stopped

  # ⭐ 本地 Ollama 容器化：替代 host.docker.internal
  # Docker Desktop Windows 下容器无法路由到宿主机（host.docker.internal→192.168.65.254 不可达），
  # 故将 Ollama 跑在同 compose 网络中，各后端服务通过 http://ollama:11434 访问。
  # 模型目录挂载宿主机已下载权重（D:\ollama-models），避免重复拉取。
  ollama:
    image: ollama/ollama:latest
    container_name: smartassistant-ollama-1
    ports:
      - "11434:11434"
    volumes:
      - D:\ollama-models:/root/.ollama
    environment:
      OLLAMA_MODELS: /root/.ollama
      OLLAMA_HOST: 0.0.0.0:11434
      # ⭐ 模型常驻内存（-1=无限），避免首次推理耗时 ~60s 加载模型
      OLLAMA_KEEP_ALIVE: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  nacos-data:
